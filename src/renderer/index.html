<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Code Pet</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
      }

      #pet {
        position: relative;
        width: 112px;
        height: 112px;
        cursor: grab;
        animation: float 3s ease-in-out infinite;
      }

      #pet-sprite {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 5px 5px rgb(52 44 64 / 16%));
      }

      #pet.state-happy {
        animation: bounce 500ms ease-in-out infinite alternate;
      }

      #pet.state-panic {
        animation: shake 160ms linear infinite;
      }

      #pet.state-sleep {
        animation: breathe 2.8s ease-in-out infinite;
      }

      #pet.state-waking {
        animation: groggy-wobble 240ms ease-in-out infinite alternate;
      }

      #pet.micro-hop {
        animation: tiny-hop 380ms ease-in-out;
      }

      #pet.micro-blink #pet-sprite {
        animation: blink 180ms ease-in-out;
      }

      #pet.state-sleep::after {
        content: 'z';
        position: absolute;
        top: 0;
        right: 6px;
        color: #8291b7;
        font: 700 17px/1 system-ui, sans-serif;
        animation: drift-z 2.2s ease-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      @keyframes bounce {
        from { transform: translateY(1px) scale(.98); }
        to { transform: translateY(-8px) scale(1.03); }
      }

      @keyframes shake {
        0%, 100% { transform: translate(0, 0) rotate(0); }
        25% { transform: translate(-2px, 1px) rotate(-2deg); }
        75% { transform: translate(2px, -1px) rotate(2deg); }
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1) rotate(-2deg); }
        50% { transform: scale(1.04, .97) rotate(-2deg); }
      }

      @keyframes drift-z {
        0% { opacity: 0; transform: translate(0, 7px) scale(.8); }
        35% { opacity: 1; }
        100% { opacity: 0; transform: translate(7px, -18px) scale(1.2); }
      }

      @keyframes groggy-wobble {
        from { transform: rotate(-7deg) translateY(1px); }
        to { transform: rotate(7deg) translateY(-2px); }
      }

      @keyframes tiny-hop {
        0%, 100% { transform: translateY(0); }
        45% { transform: translateY(-9px); }
      }

      @keyframes blink {
        0%, 100% { transform: scaleY(1); }
        45% { transform: scaleY(.08); }
      }

      #state {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8px;
        color: #312e38;
        font: 12px/1.2 system-ui, sans-serif;
        text-align: center;
        text-shadow: 0 1px 2px white;
      }
    </style>
  </head>
  <body>
    <div id="pet" class="state-idle" aria-label="Code pet">
      <img id="pet-sprite" alt="Idle ghost holding a warm mug">
    </div>
    <div id="state">idle</div>
    <script src="micro-animation.js"></script>
    <script>
      const pet = document.getElementById('pet');
      const sprite = document.getElementById('pet-sprite');
      const stateLabel = document.getElementById('state');
      let currentState = 'idle';
      let petName = 'Ghost';
      let spriteBaseUrl = new URL('../../assets/pets/ghost/', window.location.href).href;
      let dragging = false;

      function showState(state) {
        currentState = state;
        pet.className = `state-${state}`;
        stateLabel.textContent = `${petName} · ${state}`;
        sprite.alt = `${state} ${petName}`;
        const spriteState = state === 'waking' ? 'sleep' : state;
        const pngUrl = new URL(`${spriteState}.png`, spriteBaseUrl).href;
        const svgUrl = new URL(`${spriteState}.svg`, spriteBaseUrl).href;
        sprite.onerror = () => {
          if (sprite.src !== pngUrl) return;
          sprite.onerror = null;
          sprite.src = svgUrl;
        };
        sprite.src = pngUrl;
      }

      function applySettings(settings) {
        if (settings.petName) petName = settings.petName;
        if (settings.spriteBaseUrl) spriteBaseUrl = settings.spriteBaseUrl;
        showState(settings.state || currentState);
      }

      pet.addEventListener('mouseenter', () => window.petWindow?.mouseOverPet());
      pet.addEventListener('mouseleave', () => {
        if (!dragging) window.petWindow?.mouseOutPet();
      });
      pet.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        dragging = true;
        pet.setPointerCapture(event.pointerId);
        window.petWindow?.startDrag({ x: event.screenX, y: event.screenY });
      });
      pet.addEventListener('pointermove', (event) => {
        if (dragging) window.petWindow?.moveDrag({ x: event.screenX, y: event.screenY });
      });
      function stopDragging(event) {
        if (!dragging) return;
        dragging = false;
        window.petWindow?.endDrag(event ? { x: event.screenX, y: event.screenY } : undefined);
      }
      pet.addEventListener('pointerup', stopDragging);
      pet.addEventListener('pointercancel', stopDragging);
      showState('idle');
      window.petWindow?.onStateChanged(showState);
      window.petWindow?.onSettingsChanged(applySettings);
      window.petWindow?.getSettings().then(applySettings).catch(() => {});

      const microAnimations = window.petMicroAnimation.createMicroAnimationScheduler({
        isEnabled: () => currentState === 'idle',
        onAnimation: (animation) => {
          pet.classList.remove('micro-blink', 'micro-hop');
          pet.classList.add(`micro-${animation}`);
          setTimeout(() => pet.classList.remove(`micro-${animation}`), 500);
        },
      });
      microAnimations.start();
    </script>
  </body>
</html>
